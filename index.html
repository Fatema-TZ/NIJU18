.stage{position:relative;width:min(100vw,460px);margin:0 auto;aspect-ratio:9/17;overflow:hidden}
.a{position:absolute;opacity:0;transform:scale(.6);transition:opacity .7s,transform .8s cubic-bezier(.3,1.5,.5,1)}
.go .a{opacity:1;transform:rotate(var(--r,0deg))}
.go .d1{transition-delay:.3s}.go .d2{transition-delay:.7s}.go .d3{transition-delay:1.1s}.go .d4{transition-delay:1.5s}.go .d5{transition-delay:1.9s}
.cake{left:-5%;top:1.5%;width:44%}
.disco{left:-5%;top:17%;width:17%}
.cherry{left:50%;top:.5%;width:22%}
.ribbon{right:-22%;top:6.5%;width:70%;--r:50deg;background:linear-gradient(#f2f0f4,#c9c6cf);color:#222;text-align:center;font:700 clamp(.9rem,4.6vw,1.2rem)/1.7 'Cormorant Garamond',serif;letter-spacing:.04em;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.pol{left:8%;top:22%;width:80%;--r:-1.5deg;background:#fbfaf8;padding:6% 6% 0;box-shadow:0 14px 30px rgba(60,10,15,.45)}
.pol .ph{display:block;width:100%;aspect-ratio:900/1035;background:#000;overflow:hidden}
.pol img{display:block;width:100%;height:100%;object-fit:cover;filter:brightness(0) contrast(.6)}
.go .pol img{filter:none;transition:filter 4.5s ease 2s}
.cap{position:relative;height:clamp(64px,19vw,88px);font:700 clamp(1.5rem,7.6vw,2.1rem)/1 'Caveat',cursive;padding:5% 0 0 36%;color:#1b1b1b}
.kiss{position:absolute;right:3%;bottom:10%;width:20%}
.bear{left:-2%;top:56.5%;width:30%}
.candle{right:5%;top:79%;width:20%}
.flame{transform-origin:50% 100%;animation:fl 1.1s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}
.msg{left:8%;right:8%;top:86.5%;text-align:center;font:italic 700 clamp(1.1rem,5.2vw,1.45rem)/1.3 'Cormorant Garamond',serif;color:#fff;text-shadow:0 1px 6px rgba(60,5,10,.8)}
