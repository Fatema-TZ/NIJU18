<style>

<script>
var W=[

var RM=matchMedia('(prefers-reduced-motion:reduce)').matches,K=RM?0:1;
var $=function(i){return document.getElementById(i)};
var opened={},nOpen=0,fin=false,started=false;

/* ---------- envelopes ---------- */
var grid=$('grid');
W.forEach(function(w,i){
  var b=document.createElement('button');
  b.className='env';b.style.setProperty('--i',i);
  b.setAttribute('aria-label','Open wish '+(i+1));

});
function openWish(i,b){
  if(!opened[i]){opened[i]=1;nOpen++}

  $('wish').textContent=W[i][1];
  $('close').textContent=(nOpen==18&&!fin)?'Finish':'Close';
  $('count').textContent=nOpen+' of 18 opened';
  wake();

}
$('close').onclick=function(){tone(659.25,.5,.07);$('dlg').close()};
$('dlg').addEventListener('click',function(e){if(e.target===this)this.close()});
$('dlg').addEventListener('close',function(){
  if(nOpen==18&&!fin){
    fin=true;$('fin').hidden=false;
    $('count').textContent='All 18 opened. Happy birthday, Nijum!';
    celebrate();
  }
});
$('again').onclick=celebrate;
function celebrate(){fanfare();confetti()}

/* ---------- audio (synthesized, no files) ---------- */
var AC,master,mute,muted=false;
function wake(){if(AC&&AC.state!=='running'){try{AC.resume()}catch(e){}}}
function unlockIOS(){
  try{
    var a=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
    a.play().catch(function(){});
  }catch(e){}
}
function initAudio(){
  try{
    unlockIOS();
    AC=new (window.AudioContext||window.webkitAudioContext)();
    wake();
    mute=AC.createGain();mute.connect(AC.destination);
    master=AC.createGain();master.gain.value=.55;master.connect(mute);
    var dl=AC.createDelay();dl.delayTime.value=.26;
    var fb=AC.createGain();fb.gain.value=.3;
    var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
    master.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(mute);
  }catch(e){AC=null}
}
function bell(f,t,d,v){
  if(!AC)return;
  [[1,1],[2,.35],[3.01,.12]].forEach(function(p){
    var o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f*p[0];
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(v*p[1],t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
  });
}
function tone(f,d,v){if(AC)bell(f,AC.currentTime,d,v)}
var PENT=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1568,1760];
function chime(i){
  if(!AC)return;
  var t=AC.currentTime,s=i%6;
  /* paper rustle */
  var n=AC.sampleRate*.14,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(var k=0;k<n;k++)d[k]=(Math.random()*2-1)*(1-k/n);
  var src=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
  bp.type='bandpass';bp.frequency.value=3200;g.gain.value=.07;
  src.buffer=buf;src.connect(bp);bp.connect(g);g.connect(master);src.start(t);
  [0,2,4,5].forEach(function(o,j){bell(PENT[s+o>9?9:s+o],t+.08+j*.1,1.3,.13)});
}
function fanfare(){
  if(!AC)return;var t=AC.currentTime;
  [523.25,659.25,783.99,1046.5,1318.5,1568].forEach(function(f,j){bell(f,t+j*.11,1.8,.15)});
}
function song(){
  if(!AC)return;
  var N=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
         [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
         [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],
         [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,3]];
  var t=AC.currentTime+.5,beat=.52;
  N.forEach(function(n){
    bell(n[0],t,Math.min(2,n[1]*beat+.9),.17);
    bell(n[0]/2,t,Math.min(2,n[1]*beat+.9),.06);
    t+=n[1]*beat;
  });
}
$('snd').onclick=function(){
  muted=!muted;this.textContent=muted?'🔇':'🔊';
  if(mute)mute.gain.value=muted?0:1;
};

/* ---------- confetti ---------- */
var cv=$('cv'),cx=cv.getContext('2d'),P=[],run=false;
var CC=['#d8b45a','#f4de9c','#c3b2f2','#f8f6ff','#4a5bc0','#0d0d1c'];
function confetti(){
  if(RM)return;
  cv.width=innerWidth;cv.height=innerHeight;
  var now=performance.now();
  for(var i=0;i<230;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.7,vy:2.6+Math.random()*3.2,ph:Math.random()*6,sw:.4+Math.random()*1.1,w:5+Math.random()*5,h:9+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.2,c:CC[i%CC.length],b:now});
  if(!run){run=true;requestAnimationFrame(tick)}
}
function tick(now){
  cx.clearRect(0,0,cv.width,cv.height);
  P=P.filter(function(p){return now-p.b<5200&&p.y<cv.height+30});
  P.forEach(function(p){
    p.y+=p.vy;p.ph+=.05;p.x+=Math.sin(p.ph)*p.sw;p.r+=p.vr;
    var a=now-p.b<3000?1:Math.max(0,1-(now-p.b-3000)/2200);
    cx.globalAlpha=a;cx.fillStyle=p.c;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
  });
  if(P.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}

/* ---------- balloons ---------- */
var sky=$('sky'),BC=['#d8b45a','#c3b2f2','#f8f6ff','#4a5bc0','#2b3a8c','#14142b'],BW=[];
for(var i=0;i<18;i++){
  var w=document.createElement('div'),b=document.createElement('div');
  w.className='bw';b.className='b';
  b.style.setProperty('--c',BC[i%BC.length]);
  b.style.animationDelay=(i%5*.4)+'s';
  w.style.left='calc('+(i/17)+' * (100% - var(--bs)))';
  w.dataset.o=Math.round(34*Math.pow((i-8.5)/8.5,2));
  w.style.transform='translateY('+(innerHeight+220)+'px)';
  w.appendChild(b);sky.appendChild(w);BW.push(w);
}
function rise(){
  BW.forEach(function(w,i){
    w.style.transition=RM?'none':'transform 2.4s cubic-bezier(.16,.8,.24,1) '+(i*.06)+'s';
    w.style.transform='translateY('+w.dataset.o+'px)';
  });
}

/* ---------- opening sequence ---------- */
document.documentElement.classList.add('lock');
$('go').onclick=function(){
  if(started)return;started=true;
  $('gate').classList.add('out');
  initAudio();song();confetti();
  setTimeout(rise,3600*K);
  setTimeout(function(){$('t1').classList.add('on')},6300*K);
  setTimeout(function(){$('t2').classList.add('on');$('t3').classList.add('on')},7300*K);
  setTimeout(function(){$('t4').classList.add('on');$('count').classList.add('on')},8200*K);
  setTimeout(function(){grid.classList.add('on');document.documentElement.classList.remove('lock')},8900*K);
};
</script>
<script>
/* Sound v2: songs and chimes are rendered into WAV audio and played with normal audio elements (more reliable on Android) */
var SR=22050,cache={},songEl=null,warned=false;
function render(ev,len){
  var n=Math.floor(len*SR),d=new Float32Array(n),i;
  ev.forEach(function(e){
    var s=Math.floor(e[1]*SR),m=Math.min(n,s+Math.floor((e[2]+.1)*SR));
    [[1,1],[2,.35],[3.01,.12]].forEach(function(p){
      var w=2*Math.PI*e[0]*p[0]/SR,tau=e[2]/4;
      for(var k=s;k<m;k++){var t=(k-s)/SR;d[k]+=Math.sin(w*(k-s))*e[3]*p[1]*Math.min(1,t/.012)*Math.exp(-t/tau)}
    });
  });
  var D=Math.floor(.26*SR);
  for(i=D;i<n;i++)d[i]+=d[i-D]*.3;
  var pk=0;for(i=0;i<n;i++)pk=Math.max(pk,Math.abs(d[i]));
  var g=pk>0?.75/pk:1;for(i=0;i<n;i++)d[i]*=g;
  return d;
}
function wavBuf(d){
  var n=d.length,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  function s(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))}
  s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);
  for(var i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,d[i]))*32767,true);
  return b;
}
function dataUri(b){
  var u=new Uint8Array(b),s='';
  for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  return 'data:audio/wav;base64,'+btoa(s);

function mk(key,ev,len){
  if(!cache[key]){var b=wavBuf(render(ev,len));cache[key]={b:b,u:URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}}

}
function warn(){

}

}
var PN=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1568,1760];
function initAudio(){}
function wake(){}
function tone(f,d,v){playW(mk('t'+f,[[f,0,d,v]],d+.4),false)}
function chime(i){
  var s=i%6,ev=[];
  [0,2,4,5].forEach(function(o,j){ev.push([PN[Math.min(9,s+o)],.05+j*.1,1.3,.13])});

}
function fanfare(){
  var ev=[];
  [523.25,659.25,783.99,1046.5,1318.5,1568].forEach(function(f,j){ev.push([f,j*.11,1.8,.15])});

}
function song(){
  var N=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
         [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
         [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],
         [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,3]];
  var t=.3,beat=.52,ev=[];
  N.forEach(function(n){
    var d=Math.min(2,n[1]*beat+.9);
    ev.push([n[0],t,d,.17]);ev.push([n[0]/2,t,d,.06]);
    t+=n[1]*beat;
  });
  playW(mk('song',ev,t+3),true);
}
$('snd').onclick=function(){
  muted=!muted;this.textContent=muted?'🔇':'🔊';
  if(songEl)songEl.muted=muted;
};
